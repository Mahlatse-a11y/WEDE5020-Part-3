<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="My style.css">
</head>
<body>
    <header>
        <nav>
                <a href="Contact Us.html">Contact Us</a>
                <a href="About Us.html">About Us</a>
                <a href="Tips&Blogs.html">Tips&Blogs</a>
        </nav>
<table class="container" align="center">
    <tr>
        <td>
            <h1>Checkout</h1>
            <p>Review your order and confirm</p>
        </td>
    </tr>
 
    <tr>
        <td>
            <table class="order-code" width="100%">
                <tr>
                    <td align="center">
                        <p><strong id="orderCode">MM-XXXXXX</strong></p>

                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>
            <h2>Order Receipt</h2>
            <table id="receiptTable" width="100%">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th class="right">Price</th>
                    </tr>
                </thead>
                <tbody id="receiptBody">
                    <script>
                        <div id="receipt-container"></div>
                        renderCheckoutReceipt();
                        </script>
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td>Total</td>
                        <td class="right" id="totalPrice">R0.00</td>
                    </tr>
                </tfoot>
            </table>
        </td>
    </tr>

    <tr>
        <td style="padding-top:15px;">
            <p><strong>Customer:</strong> <span id="custName">Guest</span></p>
            <p><strong>Date:</strong> <span id="orderDate"></span></p>
        </td>
    </tr>

    <tr>
        <td>
            <button><a href="Payment.html">Confirm Order</a></button>
            <button><a href="products.html">Back to Shopping</a></button>
            
            <table id="successMsg" class="success" width="100%" style="display:none;">
                <tr>
                    <td align="center">Order Confirmed! Please show your order code at the salon.</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
